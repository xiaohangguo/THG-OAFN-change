[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thg-oafn-financial-risk"
version = "0.1.0"
description = "Reproducible causal temporal graph experiments for AML risk monitoring"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
