project:
  name: thg-oafn-financial-risk
  local_workspace: D:/THG-OAFN-Financial-Experiment
  seed_list: [42, 123, 456, 789, 2024]

data:
  dataset: ibm_aml_hi_small
  transactions_path: D:/THG-OAFN-Financial-Experiment/data_cache/ibm_aml/HI-Small_Trans.csv
  accounts_path: D:/THG-OAFN-Financial-Experiment/data_cache/ibm_aml/HI-Small_accounts.csv
  audit_path: D:/THG-OAFN-Financial-Experiment/metadata/ibm_hi_small_audit.json
  csv_chunksize: 250000

split:
  strategy: chronological_grouped_timestamp
  train_ratio: 0.60
  validation_ratio: 0.20
  test_ratio: 0.20
  enforce_no_future_features: true

evaluation:
  primary_metrics: [auprc, recall_at_0_1pct, recall_at_0_5pct, recall_at_1pct, precision_at_k]
  secondary_metrics: [roc_auc, f1_validation_threshold, precision, recall]
  alert_capacities: [0.001, 0.005, 0.01]
  bootstrap_resamples: 1000

storage:
  commit_raw_data: false
  commit_predictions: false
  commit_checkpoints: false
